[project]
name = "web-easy-learn"
version = "0.1.0"
description = "Crawl docs + translate to VN for personal knowledge base"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "bleach>=6.1",
    "pathvalidate>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "google-genai>=0.3",
    "pypandoc-binary>=1.13",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
